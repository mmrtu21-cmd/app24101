<!DOCTYPE html>
<html lang="ru" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Школьный помощник</title>
<style>
:root{--bg:#f2f2f7;--fg:#111;--sub:#6e6e73;--glass:rgba(255,255,255,.74);--line:rgba(60,60,67,.14);--accent:var(--tg-theme-button-color,#0a84ff);--on:var(--tg-theme-button-text-color,#fff);--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--sh:0 6px 18px rgba(0,0,0,.06);--e:cubic-bezier(.32,.72,0,1);color-scheme:light}
:root[data-scheme=dark]{--bg:#000;--fg:#f5f5f7;--sub:#98989f;--glass:rgba(44,44,46,.72);--line:rgba(255,255,255,.14);--sh:0 6px 18px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;color:var(--fg);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(90% 40% at 50% -5%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .35s var(--e),background .25s,opacity .25s}
button:active{transform:scale(.96)}
.app{max-width:520px;margin:0 auto}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
.top p{color:var(--sub);font-size:14px;margin-top:2px}
.island{margin:16px 0 14px;display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:28px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.35)}
.ic{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.ic svg{width:22px;height:22px}
.b{flex:1;min-width:0}
.nm{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmv{font-size:12.5px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pulse{width:9px;height:9px;flex:none;border-radius:50%;background:var(--green);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(48,209,88,.55)}100%{box-shadow:0 0 0 10px transparent}}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;margin-bottom:16px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--accent);transition:transform .45s cubic-bezier(.34,1.4,.64,1)}
.seg[data-t="1"] i{transform:translateX(100%)}
.seg button{position:relative;padding:10px 0;font-weight:650;font-size:14.5px;color:var(--sub);transition:color .3s}
.seg button.on{color:var(--on)}
.view{animation:in .4s var(--e)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.d{position:relative;padding:11px 0;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--sub)}
.d.sel{color:var(--on);background:var(--accent);border-color:transparent}
.d.td{padding-bottom:15px}
.d.td::after{content:"";position:absolute;left:50%;bottom:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.st{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 10px;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sub)}
.st b{font-size:20px;letter-spacing:-.02em;text-transform:none;color:var(--fg)}
.st button{font-size:13px;font-weight:650;text-transform:none;letter-spacing:0;color:var(--accent)}
.card{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:10px;border-radius:22px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh)}
.n{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.card.live{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}
.card.live .n{color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent)}
.card.no,.card.past{opacity:.5}
.rm{font-size:12px;font-weight:650;color:var(--sub);padding:5px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.rm b{color:var(--green)}
.cb{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.cb svg{width:15px;height:15px;stroke-width:3}
.done .cb{background:var(--green);border-color:var(--green);color:#fff}
.hs{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.ht{font-size:15px;font-weight:550;word-break:break-word}
.done{opacity:.7}
.done .ht{text-decoration:line-through;color:var(--sub)}
.hd{font-size:12px;font-weight:600;color:var(--sub);margin-top:3px}
.hd.late{color:var(--red)}
.hd.today{color:var(--orange)}
.del{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.del:active{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:14px;line-height:1.5}
.form{margin-top:20px;padding:16px;border-radius:24px;background:var(--glass);border:1px solid var(--line)}
.form h3{font-size:16px;font-weight:750;margin-bottom:10px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:650;color:var(--sub)}
.chip.on{background:var(--accent);color:var(--on);border-color:transparent}
.row{display:flex;gap:8px}
.in{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px;outline:none}
.in:focus{border-color:var(--accent)}
.in::placeholder{color:var(--sub)}
#due{flex:none;width:150px}
.add{margin-top:12px;width:100%;padding:14px;border-radius:16px;background:var(--accent);color:var(--on);font-weight:700}
.sh{animation:sh .4s var(--e)}
@keyframes sh{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));padding:11px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--sh);font-size:13.5px;font-weight:650;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:opacity .3s,transform .4s var(--e)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
 <header class="top"><h1 id="gr"></h1><p>Расписание и домашние задания</p></header>
 <section class="island" id="isl" aria-live="polite"></section>
 <nav class="seg" id="seg" data-t="0"><i></i><button class="on" data-t="0">Расписание</button><button data-t="1">Домашка</button></nav>

 <section class="view" id="v0">
  <div class="days" id="days"></div>
  <div class="st"><b id="dayTitle"></b><span id="dayCap"></span></div>
  <div id="lessons"></div>
 </section>

 <section class="view" id="v1" hidden>
  <div class="st"><span>К выполнению</span><span id="prog"></span></div>
  <div id="hwAct"></div>
  <div id="doneBox" hidden>
   <div class="st"><span>Выполнено · <span id="doneCnt"></span></span><button data-a="c">Очистить</button></div>
   <div id="hwDone"></div>
  </div>
  <div class="form">
   <h3>Новое задание</h3>
   <div class="chips" id="chips"></div>
   <div class="row"><input class="in" id="txt" maxlength="160" placeholder="Что нужно сделать…" autocomplete="off"><input class="in" id="due" type="date" aria-label="Срок"></div>
   <button class="add" id="add">Добавить</button>
  </div>
 </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
'use strict';
const GRADE=8,KEY='school_hw_v2';
const BELLS=[['08:00','08:40'],['08:50','09:30'],['09:50','10:30'],['10:50','11:30'],['11:50','12:30'],['12:40','13:20'],['13:30','14:10'],['14:20','15:00'],['15:10','15:50']];
const DAYS=['Пн','Вт','Ср','Чт','Пт'],FULL=['Понедельник','Вторник','Среда','Четверг','Пятница'];
const L=(s,r)=>({s,r});
const SCHEDULE=[
 [L('Разговоры о важном','303А'),L('Русский язык','303А'),L('Физкультура (самбо)','С-1'),L('Физика','207А'),L('Алгебра','302А'),L('Биология','206А'),L('Информатика','—')],
 [L('Нет',''),L('Литература','303А'),L('История','101Г'),L('Иностранный язык','103А'),L('Физика','207А'),L('Алгебра','303А'),L('Русский язык','303А'),L('ОБЗР','107А')],
 [L('Химия','208А'),L('Иностранный язык','103А'),L('Геометрия','302А'),L('Геометрия','302А'),L('Русский язык','303А'),L('История','101Г'),L('Физкультура','С-1/2')],
 [L('Россия — мои горизонты','303А'),L('Алгебра','302А'),L('Физкультура','С-2-2'),L('География','101А'),L('Химия','208А'),L('Иностранный язык','103А'),L('Музыка','203Б')],
 [L('История','101Г'),L('Литература','303А'),L('Вероятность и статистика','302А'),L('География','101А'),L('Труд (технология)','331Г'),L('Биология','206А'),L('Практикум по геометрии','302А')]
];
const S=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const ico={
 clock:S('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.5 2"/>'),
 sun:S('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>'),
 done:S('<circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.5 2.4 2.4 4.8-5"/>'),
 book:S('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M8 7h8M8 10h6"/>'),
 cup:S('<path d="M5 9h11v5.5A4.5 4.5 0 0 1 11.5 19h-2A4.5 4.5 0 0 1 5 14.5z"/><path d="M16 10.5h1.8a2.6 2.6 0 0 1 0 5.2H16M9 4.5v1.6M12 4v2.2"/>'),
 tick:S('<path d="m5 12.5 4.5 4.5L19 7"/>'),
 trash:S('<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/>')
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=t=>{const[a,b]=t.split(':');return a*60+ +b};
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const todayIdx=()=>{const d=new Date().getDay();return d>=1&&d<=5?d-1:-1};
const real=d=>SCHEDULE[d].map((l,i)=>l.s==='Нет'?-1:i).filter(i=>i>=0);
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

/* ---------- Telegram ---------- */
const root=document.documentElement;
const setScheme=s=>{root.dataset.scheme=s==='dark'?'dark':'light'};
setScheme(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
const hap=k=>{try{const h=Telegram.WebApp.HapticFeedback;k==='ok'?h.notificationOccurred('success'):k==='sel'?h.selectionChanged():h.impactOccurred('light')}catch(e){}};
function paintTG(tg){const c=getComputedStyle(root).getPropertyValue('--bg').trim();try{tg.setHeaderColor(c);tg.setBackgroundColor(c)}catch(e){}}
function initTG(){
 const tg=window.Telegram&&Telegram.WebApp;if(!tg)return;
 try{
  tg.ready();tg.expand();
  if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();
  setScheme(tg.colorScheme);paintTG(tg);
  tg.onEvent('themeChanged',()=>{setScheme(tg.colorScheme);paintTG(tg)});
 }catch(e){}
}
try{
 if(window.Telegram)initTG();
 else{const sc=document.createElement('script');sc.src='https://telegram.org/js/telegram-web-app.js';sc.onload=initTG;document.head.appendChild(sc)}
}catch(e){}

/* ---------- Статус ---------- */
function status(){
 const m=nowM(),t=todayIdx();
 const nextInfo=(d,pre)=>{const r=real(d),i=r[0];return `${pre}: ${SCHEDULE[d][i].s} в ${BELLS[i][0]}`};
 if(t<0)return{i:'sun',c:'orange',t:'Сегодня выходной',s:nextInfo(0,'В понедельник')};
 const day=SCHEDULE[t],r=real(t),f=r[0],l=r[r.length-1];
 if(m<tm(BELLS[f][0]))return{i:'clock',c:'accent',t:'До начала уроков',s:`${day[f].s} · каб. ${day[f].r||'—'} · через ${tm(BELLS[f][0])-m} мин`};
 if(m>=tm(BELLS[l][1])){const nd=(t+1)%5;return{i:'done',c:'green',t:'Уроки закончились',s:nextInfo(nd,t===4?'В понедельник':'Завтра')}}
 const cur=r.find(i=>m>=tm(BELLS[i][0])&&m<tm(BELLS[i][1]));
 if(cur!==undefined)return{i:'book',c:'green',live:1,t:`Идёт урок: ${day[cur].s}`,s:`Каб. ${day[cur].r||'—'} · до звонка ${tm(BELLS[cur][1])-m} мин`};
 const nx=r.find(i=>tm(BELLS[i][0])>m);
 return{i:'cup',c:'accent',t:'Перемена',s:`Далее: ${day[nx].s} · каб. ${day[nx].r||'—'} · через ${tm(BELLS[nx][0])-m} мин`};
}
function renderStatus(){
 const s=status();
 $('isl').innerHTML=`<div class="ic" style="--c:var(--${s.c})">${ico[s.i]}</div><div class="b"><div class="nm">${esc(s.t)}</div><div class="tmv">${esc(s.s)}</div></div>${s.live?'<span class="pulse"></span>':''}`;
}

/* ---------- Расписание ---------- */
function initialDay(){
 const t=todayIdx();if(t<0)return 0;
 const r=real(t);return nowM()>=tm(BELLS[r[r.length-1]][1])?(t+1)%5:t;
}
let sel=initialDay();
function renderDays(){
 const t=todayIdx();
 $('days').innerHTML=DAYS.map((d,i)=>`<button class="d${i===sel?' sel':''}${i===t?' td':''}" data-i="${i}" aria-label="${FULL[i]}">${d}</button>`).join('');
}
function renderLessons(){
 const t=todayIdx(),m=nowM(),cnt=real(sel).length;
 const pre=sel===t?'Сегодня · ':(t>=0&&t<4&&sel===t+1)?'Завтра · ':((t<0||t===4)&&sel===0)?'Ближайший учебный день · ':'';
 $('dayTitle').textContent=FULL[sel];
 $('dayCap').textContent=`${pre}${cnt} ${plural(cnt,'урок','урока','уроков')}`;
 $('lessons').innerHTML=SCHEDULE[sel].map((l,i)=>{
  const[a,b]=BELLS[i],no=l.s==='Нет',today=sel===t,live=!no&&today&&m>=tm(a)&&m<tm(b),past=today&&m>=tm(b);
  return `<div class="card${no?' no':''}${live?' live':''}${past?' past':''}"><div class="n">${no?'–':i+1}</div><div class="b"><div class="nm">${no?'Нет урока':esc(l.s)}</div><div class="tmv">${a} – ${b}</div></div>${no?'':`<div class="rm">${live?'<b>Идёт</b> · ':''}${esc(l.r||'—')}</div>`}</div>`;
 }).join('');
}
$('days').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;sel=+b.dataset.i;hap('sel');renderDays();renderLessons()};
$('seg').onclick=e=>{
 const b=e.target.closest('[data-t]');if(!b||b===$('seg'))return;
 const t=+b.dataset.t;$('seg').dataset.t=t;
 $('seg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
 $('v0').hidden=t!==0;$('v1').hidden=t!==1;hap('sel');
};

/* ---------- Домашка (хранится только на устройстве, по умолчанию пусто) ---------- */
let HW=(()=>{try{const a=JSON.parse(localStorage.getItem(KEY));return Array.isArray(a)?a.filter(x=>x&&x.id&&x.text):[]}catch(e){return[]}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(HW))}catch(e){toast('Не удалось сохранить')}};
let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}
function dueInfo(d){
 if(!d)return null;
 const a=new Date();a.setHours(0,0,0,0);
 const diff=Math.round((new Date(d+'T00:00')-a)/864e5);
 if(diff<0)return{t:'Просрочено',c:'late'};
 if(diff===0)return{t:'Сегодня',c:'today'};
 if(diff===1)return{t:'Завтра',c:''};
 return{t:new Date(d+'T00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'}),c:''};
}
const item=x=>{
 const d=x.done?null:dueInfo(x.due);
 return `<div class="card${x.done?' done':''}" data-id="${esc(x.id)}"><button class="cb" data-a="t" aria-label="Выполнено">${ico.tick}</button><div class="b"><div class="hs">${esc(x.subject)}</div><div class="ht">${esc(x.text)}</div>${d?`<div class="hd ${d.c}">${d.t}</div>`:''}</div><button class="del" data-a="d" aria-label="Удалить">${ico.trash}</button></div>`;
};
function renderHW(){
 const act=HW.filter(x=>!x.done).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1),done=HW.filter(x=>x.done);
 $('hwAct').innerHTML=act.length?act.map(item).join(''):'<div class="empty">Заданий пока нет.<br>Выберите предмет ниже и добавьте первое.</div>';
 $('doneBox').hidden=!done.length;$('doneCnt').textContent=done.length;
 $('hwDone').innerHTML=done.map(item).join('');
 $('prog').textContent=HW.length?`${done.length} из ${HW.length}`:'';
}
$('v1').onclick=e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,el=b.closest('[data-id]'),x=el&&HW.find(h=>h.id===el.dataset.id);
 if(a==='t'&&x){x.done=!x.done;hap(x.done?'ok':'l')}
 else if(a==='d'&&x){HW=HW.filter(h=>h!==x);hap('l')}
 else if(a==='c'){HW=HW.filter(h=>!h.done);hap('l')}
 else return;
 save();renderHW();
};

/* форма: предметы берутся из расписания, срок подставляется по ближайшему уроку */
const SUBJ=[...new Set(SCHEDULE.flat().map(l=>l.s))].filter(s=>s!=='Нет').concat('Другое');
let subj='',touched=false;
function nextDate(s){
 for(let i=1;i<=7;i++){const d=new Date();d.setDate(d.getDate()+i);const w=d.getDay();if(w>=1&&w<=5&&SCHEDULE[w-1].some(l=>l.s===s))return iso(d)}
 return '';
}
function renderChips(){$('chips').innerHTML=SUBJ.map(s=>`<button class="chip${s===subj?' on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('')}
$('chips').onclick=e=>{
 const b=e.target.closest('[data-s]');if(!b)return;
 subj=subj===b.dataset.s?'':b.dataset.s;
 if(subj&&!touched)$('due').value=nextDate(subj);
 hap('sel');renderChips();
};
$('due').oninput=()=>{touched=true};
$('add').onclick=()=>{
 const inp=$('txt'),t=inp.value.trim();
 if(!t){inp.classList.remove('sh');void inp.offsetWidth;inp.classList.add('sh');inp.focus();hap('l');return}
 HW.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),subject:subj||'Другое',text:t,due:$('due').value,done:false});
 save();inp.value='';$('due').value='';subj='';touched=false;
 renderChips();renderHW();hap('ok');toast('Задание добавлено');
};
