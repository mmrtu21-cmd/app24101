<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Расписание уроков</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #fff);
  --bg2: var(--tg-theme-secondary-bg-color, #f1f1f4);
  --text: var(--tg-theme-text-color, #111);
  --hint: var(--tg-theme-hint-color, #8a8a8e);
  --btn: var(--tg-theme-button-color, #2481cc);
  --btn-text: var(--tg-theme-button-text-color, #fff);
  --accent: var(--tg-theme-accent-text-color, var(--btn));
  --radius: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; }
html, body { background: var(--bg2); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { min-height: 100vh; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }

header { background: var(--bg); padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 0; border-radius: 0 0 24px 24px; position: sticky; top: 0; z-index: 5; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.sub { color: var(--hint); font-size: 14px; margin-top: 2px; }
.sub b { color: var(--accent); font-weight: 600; }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 16px 0 16px; scroll-snap-type: x proximity; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; min-width: 58px; scroll-snap-align: center; border: 0; background: var(--bg2); color: var(--text); font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 14px; cursor: pointer; position: relative; transition: background .2s, color .2s, transform .15s; }
.tab:active { transform: scale(.94); }
.tab.active { background: var(--btn); color: var(--btn-text); }
.tab.today::after { content: ""; position: absolute; top: 6px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.tab.active.today::after { background: var(--btn-text); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding: 16px; }
.day-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 12px; }
.day-title h2 { font-size: 18px; font-weight: 700; }
.day-title span { color: var(--hint); font-size: 14px; }

#list { display: flex; flex-direction: column; gap: 10px; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.lesson { display: flex; align-items: center; gap: 14px; background: var(--bg); border-radius: var(--radius); padding: 14px; transition: transform .15s; }
.lesson:active { transform: scale(.985); }
.num { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 18px; background: var(--bg2); color: var(--accent); }
.info { flex: 1; min-width: 0; }
.name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.time { color: var(--hint); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.room { flex: none; background: var(--btn); color: var(--btn-text); font-weight: 700; font-size: 14px; padding: 6px 11px; border-radius: 10px; white-space: nowrap; }
.room.none { background: var(--bg2); color: var(--hint); }
.lesson.free { opacity: .6; }
.lesson.free .num { color: var(--hint); }
.lesson.now { box-shadow: inset 0 0 0 2px var(--btn); }
.now-tag { display: inline-block; font-size: 12px; font-weight: 600; color: var(--btn-text); background: var(--btn); border-radius: 8px; padding: 1px 7px; margin-left: 8px; vertical-align: 1px; }

.empty { text-align: center; padding: 56px 24px; background: var(--bg); border-radius: 24px; animation: fade .25s ease; }
.empty .emoji { font-size: 64px; line-height: 1; margin-bottom: 12px; }
.empty h3 { font-size: 20px; margin-bottom: 6px; }
.empty p { color: var(--hint); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 600px) { body { max-width: 560px; margin: 0 auto; } }
</style>
</head>
<body>
<header>
  <h1>Расписание уроков</h1>
  <div class="sub">Класс: <b id="cls"></b></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Дни недели"></nav>
</header>
<main>
  <div class="day-title"><h2 id="dayName"></h2><span id="dayCount"></span></div>
  <div id="list"></div>
</main>

<script>
const CLASS_NAME = "8 класс"; // ← укажите свой класс

const BELLS = {
  1: ["08:00", "08:40"], 2: ["08:50", "09:30"], 3: ["09:50", "10:30"],
  4: ["10:50", "11:30"], 5: ["11:50", "12:30"], 6: ["12:40", "13:20"],
  7: ["13:30", "14:10"], 8: ["14:20", "15:00"], 9: ["15:10", "15:50"]
};

// [предмет, кабинет]; null — урока нет
const SCHEDULE = {
  1: { short: "Пн", full: "Понедельник", lessons: [
    ["Разговоры о важном", "303А"], ["Русский язык", "303А"], ["Физкультура (самбо)", "С-1"],
    ["Физика", "207А"], ["Математика", "302А"], ["Биология", "206А"], ["Информатика", "—"]] },
  2: { short: "Вт", full: "Вторник", lessons: [
    null, ["Литература", "303А"], ["История", "101Г"], ["Иностранный язык", "103А"],
    ["Физика", "207А"], ["Математика", "303А"], ["Русский язык", "303А"], ["ОБЗР", "107А"]] },
  3: { short: "Ср", full: "Среда", lessons: [
    ["Химия", "208А"], ["Иностранный язык", "103А"], ["Математика", "302А"], ["Математика", "302А"],
    ["Русский язык", "303А"], ["История", "101Г"], ["Физкультура", "С-1/2"]] },
  4: { short: "Чт", full: "Четверг", lessons: [
    ["Россия — мои горизонты", "303А"], ["Математика", "302А"], ["Физкультура", "С-2-2"],
    ["География", "101А"], ["Химия", "208А"], ["Иностранный язык", "103А"], ["Музыка", "203Б"]] },
  5: { short: "Пт", full: "Пятница", lessons: [
    ["История", "101Г"], ["Литература", "303А"], ["Математика", "302А"], ["География", "101А"],
    ["Труд (технология)", "331Г"], ["Биология", "206А"], ["Практикум по геометрии", "302А"]] }
};

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const haptic = (type = "light") => { try { tg.HapticFeedback.impactOccurred(type); } catch (e) {} };
const hapticSelect = () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} };

const realDow = new Date().getDay();            // 0 — вс
const todayId = realDow >= 1 && realDow <= 5 ? realDow : null;
let current = todayId || 1;                      // в выходные открываем Пн

const $ = id => document.getElementById(id);
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderTabs() {
  $("tabs").innerHTML = Object.entries(SCHEDULE).map(([id, d]) =>
    `<button class="tab${+id === current ? " active" : ""}${+id === todayId ? " today" : ""}" role="tab" aria-selected="${+id === current}" data-day="${id}">${d.short}</button>`
  ).join("");
}

function renderList() {
  const day = SCHEDULE[current];
  const real = day.lessons.filter(Boolean).length;
  $("dayName").textContent = day.full + (current === todayId ? " · сегодня" : "");
  $("dayCount").textContent = real ? `уроков: ${real}` : "";

  if (!real) {
    $("list").innerHTML = `<div class="empty"><div class="emoji">🌿</div><h3>Сегодня без уроков</h3><p>Отдыхайте и набирайтесь сил!</p></div>`;
    return;
  }
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  $("list").innerHTML = day.lessons.map((l, i) => {
    const n = i + 1, [s, e] = BELLS[n];
    const isNow = current === todayId && nowMin >= toMin(s) && nowMin < toMin(e);
    if (!l) return `<div class="lesson free"><div class="num">${n}</div><div class="info"><div class="name">Нет урока</div><div class="time">${s}–${e}</div></div></div>`;
    const none = l[1] === "—";
    return `<div class="lesson${isNow ? " now" : ""}"><div class="num">${n}</div>
      <div class="info"><div class="name">${esc(l[0])}${isNow ? '<span class="now-tag">идёт</span>' : ""}</div><div class="time">${s}–${e}</div></div>
      <div class="room${none ? " none" : ""}">${esc(l[1])}</div></div>`;
  }).join("");
}

function setDay(id) {
  current = id;
  renderTabs(); renderList();
  const el = document.querySelector(".tab.active");
  if (el) el.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
}

$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab");
  if (!b || +b.dataset.day === current) return;
  hapticSelect();
  setDay(+b.dataset.day);
});
$("list").addEventListener("click", e => { if (e.target.closest(".lesson")) haptic("light"); });

$("cls").textContent = CLASS_NAME;
setDay(current);
</script>
</body>
</html>
